# Configuration for Wildland Evacuation Demand and Traffic Assignment (Phase 4d)
#
# Citations for Parameters:
# 1. Roadway Characteristics: NIST TN 2252 sup Appendix B (Table B-1, pages 114-120).
# 2. Highway Capacity Bounds: Caltrans PeMS CA-99 sensor network, NIST TN 2252 sup Appendix G.
# 3. Background Commute Traffic: NIST TN 2252 sup Table A-2, row 07:57, Source ID TD-086 (p. 19).
# 4. Zone Boundaries: Butte County GIS Evacuation Plan Maps, NIST TN 2252 sup Appendix C (p. 124-125).
# 5. Evacuation Timeline: NIST TN 2252 Table 11 (p. 94) and Table 4-1 / Table D-1.
# 6. Reverse-911 Failure Rates: NIST TN 2252 sup Table D-2 (42% to 47% failure rate).
# 7. Safety Radius: >= 7.0 km based on NIST TN 2135 Section 4.5 (pages 158 and 182).
# 8. Census Demographics: US Census Bureau 2010 Decennial Census block join from tl_2010_06007_tabblock10.

scenario:
  name: "Camp_Fire_2018_Evacuation_Scenario"
  # Master ignition clock
  t0_ignition_utc: "2018-11-08T14:33:00Z"
  event_ignition_pst: "2018-11-08T06:33:00-08:00"
  time_slice_minutes: 5.0
  total_horizon_minutes: 720.0
  # Default safety radius >= 7.0 km (NIST TN 2135 Section 4.5, p. 158 & 182)
  destination_safety_buffer_km: 7.0

occupancy:
  # FHWA-HOP-08-015 Table 3-2 planning assumption
  persons_per_vehicle: 1.6
  status: "assumption"

# Background commute traffic reducing merge capacity at domain boundary exits
# NIST TN 2252 sup Table A-2 row 07:57 (Source TD-086): Bumper to bumper traffic on CA-99 in Chico
background_commute_traffic:
  chico_ca99_commute_veh_per_hr: 500.0

# Caltrans PeMS CA-99 Empirical Capacity Bounds (NIST TN 2252 sup Appendix G, Figs. G-1 to G-4)
boundary_exit_outflow_capacities:
  skyway_south_exit: 1600.0   # PeMS Skyway on-ramp / CA-99 mainline merge peak capacity (Fig. G-3)
  clark_south_exit: 1200.0    # PeMS CA-191 corridor capacity prior to 08:45 emergency closure (p. G-1)
  pentz_south_exit: 1000.0    # PeMS CA-70 connector capacity prior to 07:45 emergency closure (p. G-1)
  highway_70_south_exit: 1400.0
  fallback_exit: 1000.0

# Roadway characteristics by highway classification (NIST TN 2252 sup Table B-1, p. 114-120)
capacities_veh_per_hr_per_lane:
  motorway: 1800
  motorway_link: 1200
  trunk: 1800
  trunk_link: 1200
  primary: 1400
  primary_link: 900
  secondary: 1100
  secondary_link: 750
  tertiary: 800
  tertiary_link: 500
  residential: 500
  unclassified: 500
  service: 250
  fallback: 500

# Default number of lanes per direction (NIST TN 2252 sup Table B-1)
default_lanes_per_direction:
  trunk: 2
  primary: 1
  secondary: 1
  tertiary: 1
  residential: 1
  unclassified: 1
  service: 1
  fallback: 1

# BPR Congestion Function Parameters: t = t_0 * (1 + alpha * (V/C)^beta)
bpr_parameters:
  alpha: 0.15
  beta: 4.0

# Physical link vehicle storage parameter (HCM 2016 planning standard: ~7.7 m per queued vehicle)
jam_density_veh_per_km_per_lane: 130.0

# Inbound emergency response corridors (only these named corridors receive inbound traffic reduction)
inbound_emergency_corridors:
  - "Skyway"
  - "Clark"
  - "Neal"
  - "Pentz"
  - "Highway 70"
  - "State Highway 70"
  - "CA-70"
  - "CA 70"

# Time-dependent roadway closures from empirical field records (NIST TN 2252 sup Table A-2)
roadway_closures:
  - name: "Hwy 70 at Pentz Rd"
    closure_time_elapsed_min: 54.0   # 07:27 PST (T+54 min)
    lat: 39.649847
    lon: -121.559463
    radius_m: 600.0
    source_citation: "NIST TN 2252 sup Table A-2 row 07:29 Radio Log (p. 19)"

# Method of Successive Averages (MSA) convergence parameters
msa_convergence:
  max_iterations: 8
  tolerance: 0.015

# Capacity scaling and sensitivity parameters
capacity_sensitivity:
  default_capacity_scale: 1.0
  evaluated_scales: [1.0, 0.7, 0.5]
  default_inbound_traffic_veh_per_hr: 0.0
  evaluated_inbound_traffic_veh_per_hr: [0.0, 200.0]

# Multi-destination logit choice parameter (dispersion parameter theta)
exit_choice:
  theta: 0.15  # Sensitivity to path cost differences (minutes)

# Evacuation behavior parameters from NIST TN 2252 sup Appendix A & Appendix D
behavior:
  self_evacuation_fraction: 0.15      # 15% self-evacuate before official mandatory order (Appendix A)
  self_evac_lead_time_min: 30.0       # Self-evacuees start 30 min before official order
  reverse_911_failure_rate: 0.45      # 45% fail to receive CodeRED notification (Table D-2)
  notification_delay_unreached_min: 20.0 # Additional delay for residents not reached by reverse-911

