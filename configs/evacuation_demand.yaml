# Configuration for Wildland Evacuation Demand and Traffic Assignment (Phase 4c)
#
# Citations for Population & Evacuation Parameters:
# 1. US Census Bureau, 2010 Decennial Census, Summary File 1 (SF1), Table P1 ("Total Population")
#    for Town of Paradise (26,218 total: North=6,412, Central=7,134, East=5,828, South=6,844),
#    Magalia CDP (11,310), and Concow CDP (710). Reconciles exactly to 26,218.
# 2. NIST TN 2252 (2023) Table 4-1 / 5-2 quote: "Evacuation orders were initiated for Paradise Zones
#    at 07:46 PST, expanding county-wide through 08:20 PST."
# 3. FHWA-HOP-08-015 Table 3-2 quote: "Average vehicle occupancy for evacuation planning is
#    empirically estimated between 1.5 and 1.7 persons per vehicle."
# 4. HCM 6th Edition (2016) generalized planning tables: unverified assumption for per-lane link capacities.
# 5. Destination Safety Buffer: 6.0 km is an unverified assumption (exceeds NIST TN 2135 Table 4-8
#    maximum documented spotting distance of ~4.8 km / 3.0 mi across Feather River Canyon).

scenario:
  name: "Camp_Fire_2018_Evacuation_Scenario"
  # Unified master ignition clock across fire simulation, demand, and router
  t0_ignition_utc: "2018-11-08T14:33:00Z"
  event_ignition_pst: "2018-11-08T06:33:00-08:00"
  time_slice_minutes: 5.0
  total_horizon_minutes: 720.0
  # Conservative planning assumption: exceeds NIST TN 2135 Table 4-8 max spotting (~4.8 km)
  destination_safety_buffer_km: 6.0

occupancy:
  # FHWA-HOP-08-015 Table 3-2: 1.5 - 1.7 range -> 1.6 persons/veh assumption
  persons_per_vehicle: 1.6
  status: "assumption"

# Capacity scaling and inbound traffic sensitivity
capacity_sensitivity:
  default_capacity_scale: 1.0
  evaluated_scales: [1.0, 0.7, 0.5]
  default_inbound_traffic_veh_per_hr: 0.0
  evaluated_inbound_traffic_veh_per_hr: [0.0, 200.0]

# Planning Assumptions for Link Capacities (veh/hr/lane, HCM 6th Edition generalized planning tables)
capacities_veh_per_hr_per_lane:
  status: "planning_assumption"
  motorway: 2000
  motorway_link: 1400
  trunk: 2000
  trunk_link: 1400
  primary: 1500
  primary_link: 1000
  secondary: 1200
  secondary_link: 800
  tertiary: 900
  tertiary_link: 600
  residential: 600
  unclassified: 600
  service: 300
  fallback: 600

# Boundary Exit Finite Outflow Capacities (veh/hr across all discharge lanes at domain perimeter)
boundary_exit_outflow_capacities:
  skyway_south_exit: 2200.0   # Skyway westbound / southbound to Chico
  clark_south_exit: 1400.0    # Clark Road (CA-191) southbound to Durham/Oroville
  pentz_south_exit: 1000.0    # Pentz Road southbound to CA-70
  highway_70_south_exit: 1800.0  # CA-70 southbound towards Oroville
  fallback_exit: 1000.0

# Default number of lanes per direction when missing in OSM
default_lanes_per_direction:
  trunk: 2
  primary: 1
  secondary: 1
  tertiary: 1
  residential: 1
  unclassified: 1
  service: 1
  fallback: 1

# BPR Congestion Function Parameters: t = t_0 * (1 + alpha * (V/C)^beta)
bpr_parameters:
  alpha: 0.15
  beta: 4.0

# Documented Census Population & Sub-Zone Parameters (Reconciles exactly to 26,218)
zones:
  Paradise_North:
    census_source: "US Census 2010 SF1 Table P1 (Town of Paradise, Tract 18 block groups: upper Skyway/Clark)"
    population: 6412
    centroid_utm: [620099.0, 4404502.5]
    notification_source: "NIST TN 2252 Table 4-1 (Evacuation order issued ~07:46 PST, T+73 min)"
    notification_elapsed_min: 73.0
    departure_curve_shape: "sigmoid"
    departure_duration_min: 90.0

