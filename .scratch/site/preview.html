<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>docx preview</title>
<style>
  body { margin: 0; background: #888; }
  #host { padding: 12px 0; }
  .docx-wrapper { background: #888 !important; padding: 12px !important; }
  .docx-wrapper > section.docx { margin-bottom: 12px !important; box-shadow: none !important; }
  #status { position: fixed; top: 0; right: 0; background: #000; color: #0f0; font: 12px monospace; padding: 4px 8px; z-index: 9; }
</style>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
</head>
<body>
<div id="status">loading</div>
<div id="host"></div>
<script>
  const p = new URLSearchParams(location.search);
  const file = p.get('f') || 'mine.docx';
  fetch(file).then(r => r.blob()).then(blob =>
    docx.renderAsync(blob, document.getElementById('host'), null, {
      className: 'docx', inWrapper: true, ignoreWidth: false, ignoreHeight: false, breakPages: true,
      renderHeaders: true, renderFooters: true, useBase64URL: true
    })
  ).then(() => {
    const n = document.querySelectorAll('section.docx').length;
    document.getElementById('status').textContent = 'rendered pages=' + n;
    window.__done = true;
  }).catch(e => { document.getElementById('status').textContent = 'ERR ' + e; });
</script>
</body>
</html>
